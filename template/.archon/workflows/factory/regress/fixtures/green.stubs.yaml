# Main is still green, so there is nothing to diagnose and nothing to file.
#
# `diagnose` is absent from the stubs on purpose: its `when:` is false, so it must be
# SKIPPED, and an unstubbed node that ran would fail. `file-issues` then has to run
# anyway -- to record that the regression ran and found nothing -- which it does
# through `trigger_rule: all_done` and `if_skipped: ""` on the diagnosis binding. A
# scheduled check that goes quiet when it passes is indistinguishable from one that
# stopped being scheduled.
sync: '{"sha":"0123456789abcdef0123456789abcdef01234567","subject":"feat: sort enabled flags first"}'
suite: '{"green":true,"harness_ran":true,"failed_step":"","summary":"56 tests, 3 journeys, 3 holdout scenarios, 9 mutations killed"}'
file-issues: "regression green at 0123456; 0 issues filed"
fixture:
  expect: completed
  reached: [file-issues]
