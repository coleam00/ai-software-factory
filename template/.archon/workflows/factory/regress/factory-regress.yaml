name: factory-regress
description: |
  Run the full gate against main on a schedule, root-cause anything that broke with
  Archon's investigator, and file an issue for it. This is the node that closes the
  self-healing loop.

  Use when: the weekly trigger fires, or after N merges. By hand:
    archon workflow run factory-regress --branch factory/regress "regress"
  NOT for: per-PR validation (factory-validate).

  =====================================================================
  WHY THIS EXISTS -- the loop that closes without a human noticing first
  =====================================================================

  regression finds a break in merged code -> roots the cause -> files an issue with
  evidence -> triage accepts it -> implement opens a PR -> validate holds it out ->
  merge. No human in the loop unless all of that fails.

  Per-PR validation only ever sees one branch at a time. The failures it cannot see
  are the ones that need two merges to appear: two changes that are individually
  correct and wrong together, an assumption one PR made that the next quietly broke,
  and anything that only shows up on a cold start. Those are exactly the failures a
  scheduled full run against main catches.

  UNLIKE THE VALIDATOR, THIS IS NOT BOUND BY THE HOLDOUT. It runs against main,
  which is already-merged code, so there is nothing to hold out from. It can read
  anything and run anything. Its only output is "did this still work when I
  exercised it?"

  IT NEVER FILES AN ISSUE IT CANNOT PROVE. If the harness itself failed to run --
  a missing dependency, a port collision, a checkout that did not complete -- the
  run reports that and files NOTHING. A factory that spams its own backlog with
  bogus product bugs when it cannot prove its own test harness ran is worse than a
  factory that stayed quiet.

model: medium

# EVERY ONE OF THESE WORKFLOWS TALKS TO GITHUB, so say so. Archon hard-blocks a run at
# invocation -- before a worktree, a clone or a single token -- when the originating
# user has no GitHub identity connected. On a solo PAT install it is a no-op; on a
# shared one it turns "the label never moved and nobody knows why" into a refusal with
# a reason, which is the difference between a dead lap and an answer.
requires: [github]

inputs:
  scope:
    default: ""
    description: >-
      Optional narrowing -- a named check or area to focus on. Empty means the
      project's full gate.

returns: file-issues

nodes:
  # Snap this checkout to origin/main's tip WITHOUT flipping HEAD onto the `main`
  # branch: git refuses to have one branch checked out in two worktrees at once, and
  # the main clone legitimately holds it. Fetch plus hard reset gives the same file
  # content with none of that.
  - id: sync
    script: sync-main
    runtime: uv
    timeout: 300000
    output_format:
      type: object
      properties:
        sha: { type: string }
        subject: { type: string }
      required: [sha, subject]

  - id: suite
    script: run-suite
    runtime: uv
    depends_on: [sync]
    timeout: 3000000
    output_format:
      type: object
      properties:
        green: { type: boolean }
        harness_ran: { type: boolean }
        failed_step: { type: string }
        summary: { type: string }
      required: [green, harness_ran, failed_step, summary]

  # Only when the harness genuinely ran AND went red. A skipped harness is an infra
  # failure, and turning that into "product bugs" is how a backlog fills with fiction.
  # --- ROOT CAUSE, BY ARCHON'S INVESTIGATOR -------------------------------
  # `archon-investigate` is the pack's diagnosis primitive: it establishes a PROVEN
  # causal chain to the root cause whose fix prevents the symptom -- explicitly not the
  # first plausible explanation -- reproduces it, and writes an evidence-backed report.
  # It returns `rooted`, and `rooted: false` with the gaps named honestly is a valid
  # completion rather than a failure.
  #
  # WHY IT SITS IN FRONT OF `diagnose` RATHER THAN REPLACING IT. The two do different
  # jobs. Investigation produces ONE causal chain in prose; this workflow has to produce
  # N issues with a title, a severity, an area and a body, structured enough for a
  # script to open them and for triage to accept them. Parsing that back out of a
  # report is exactly the fragility the declared `output_format` below exists to avoid.
  # So the pack roots the cause and `diagnose` writes the issues from its report --
  # which is also the honest division: the expensive, easy-to-get-wrong half is the one
  # the factory no longer writes a prompt for.
  #
  # IT IS ADVISORY AND THE ENGINE ENFORCES THAT. The node declares
  # `mutates_checkout: false` inside the pack, so a run that reproduces the failure by
  # editing main fails, names the paths, and files NOTHING. That is the right failure:
  # loud and empty beats quiet and wrong, and this workflow's whole discipline is that
  # it never files an issue it cannot prove.
  - id: investigate
    include: archon-investigate
    depends_on: [suite]
    when: "$suite.output.green == false"
    # NOT REDUNDANT, for the same reason as `diagnose` below: whatever this writes ends
    # up quoted in an issue body that a builder reads later. An investigator that can
    # read .factory/holdout/ can carry an assertion across the wall by a route nobody
    # is watching, with every check still green.
    denied_tools:
      - "Read(.factory/holdout/**)"
      - "Glob(.factory/holdout/**)"
      - "Grep(.factory/holdout/**)"
      - "Bash(gh:*)"
    with:
      target: >-
        The scheduled gate ran against the default branch and went red. The full
        output is $ARTIFACTS_DIR/regress.log -- read it first. Establish what actually
        broke and why, to the cause whose fix prevents the symptom. `MISSION.md` in the repository root
        says what this software is for, which is how you tell a product defect from a
        harness that failed to run: a dependency that would not install, a port already
        in use, a checkout that did not complete or a missing environment variable are
        real problems and are NOT defects in this code. Say so plainly when that is what
        you find, rather than rooting a cause in software that never ran.

  # Turn the investigator's causal chain into ISSUES. This node no longer does the
  # detective work -- it does the filing, which is the part that has to be structured.
  - id: diagnose
    command: diagnose
    context: fresh
    depends_on: [investigate]
    # `rooted: false` is a valid completion and STILL WORTH FILING. An inconclusive
    # investigation with the gaps named is a better issue than no issue at all, and the
    # `infrastructure_failure` gate below is what decides whether anything is filed.
    # Gating this on `rooted` would silently drop every regression whose cause was hard,
    # which is the set you most want a human to see.
    when: "$suite.output.green == false"
    # PROVEN BY PROBE, in both directions, before being believed:
    #   allowed_tools: ["Bash(python:*)"]   grants NOTHING -- the node has NO shell.
    #   allowed_tools: [Bash]               grants a shell.
    #   denied_tools:  ["Bash(git:*)"]      genuinely blocks it.
    # So the grant is coarse and the leash is the DENY. The first version scoped the
    # grant instead, and the build nodes ran for weeks with no shell at all: they
    # could not run the quick gate, said so politely in prose, and exited 0.
    allowed_tools: [Read, Glob, Grep, Write, Bash]
    # THE HOLDOUT DENY, and it is NOT redundant here even though the regression is
    # otherwise exempt from the holdout rule. This node writes ISSUE BODIES, and an
    # issue body is read by the builder later. A diagnose node that can read
    # .factory/holdout/ can quote an assertion into an issue -- and the wall is gone
    # by a route nobody was watching. Found by bin/audit.py.
    denied_tools: ["Read(.factory/holdout/**)", "Glob(.factory/holdout/**)", "Grep(.factory/holdout/**)"]
    output_format:
      type: object
      properties:
        infrastructure_failure: { type: boolean }
        findings:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              severity: { type: string, enum: [critical, high, medium, low] }
              area: { type: string }
              body: { type: string }
              suspect_commits: { type: string }
            required: [title, severity, area, body]
        summary: { type: string }
      required: [infrastructure_failure, findings, summary]

  - id: file-issues
    script: file-issues
    runtime: uv
    depends_on: [suite, diagnose]
    trigger_rule: all_done
    with:
      green: "$suite.output.green"
      harness_ran: "$suite.output.harness_ran"
      sha: "$sync.output.sha"
      diagnosis: { from: "$diagnose.output", if_skipped: "" }
