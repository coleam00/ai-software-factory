# FLOOD PROTECTION, AND THE BINDING THAT SURVIVES IT.
#
# `classify` is deliberately absent from the stubs. Its `when:` is false here, so it
# is SKIPPED rather than run -- and an unstubbed node that actually ran would fail
# the fixture, which is what makes this an assertion instead of an omission.
#
# What that leaves is the shape this fixture exists to prove: `apply` depends on a
# node that did not produce output, and it must still run and still label the issue.
# It does that through `trigger_rule: all_done` plus `if_skipped: ""` on the decision
# binding. Get either wrong and every rate-limited issue silently stays untriaged
# forever -- no error, no label, nothing in the log.
resolve: '{"target":"gh:issue:12","number":"12"}'
flood: '{"rate_limited":true,"reason":"non-owner cap reached for 2026-09-05 (5/5)"}'
context: "stub: gathered anyway; the gather is cheap and runs off resolve"
apply: "gh:issue:12 -> factory:rate-limited"
fixture:
  expect: completed
  reached: [apply]
