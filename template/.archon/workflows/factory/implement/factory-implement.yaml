name: factory-implement
description: |
  Take ONE accepted issue from the queue to an open pull request: plan, implement,
  commit, guard, self-check, review, open. This is the PIV loop with the approvals
  removed, and the plan, implement and review steps are Archon's sdlc pack rather
  than prompts this factory carries.

  Use when: the dispatcher finds an issue labelled factory:accepted. By hand:
    archon workflow run factory-implement --branch factory/impl-12 "implement gh:issue:12"
  NOT for: triage (factory-triage), validating the PR this opens
  (factory-validate), or fixing one (factory-fix).

  IT DOES NOT MERGE AND IT DOES NOT JUDGE ITS OWN WORK. The last thing it does is
  open a PR labelled for the independent validator. A builder that can approve its
  own output is not being checked by anything.

  EVERY NODE GETS A FRESH SESSION. Not a performance choice: a node that inherits
  the previous node's context inherits its reasoning, and the whole independence
  argument rests on some nodes not having seen it.

  THE PREMIUM MODEL SITS IN THE PLAN SLOT. Two slots decide quality -- the one that
  plans and the one that implements -- and a premium model in ONE of them buys most
  of the quality of both. Premium in zero slots is what actually costs you.

model: medium

# EVERY ONE OF THESE WORKFLOWS TALKS TO GITHUB, so say so. Archon hard-blocks a run at
# invocation -- before a worktree, a clone or a single token -- when the originating
# user has no GitHub identity connected. On a solo PAT install it is a no-op; on a
# shared one it turns "the label never moved and nobody knows why" into a refusal with
# a reason, which is the difference between a dead lap and an answer.
requires: [github]

inputs:
  target:
    default: ""
    description: >-
      The issue to build, as gh:issue:<n>. When empty, it is parsed out of the
      run's trigger message.

returns: open-pr

nodes:
  - id: resolve
    script: resolve-target
    runtime: uv
    with:
      declared: "$INPUTS.target"
      kind: issue
    output_format:
      type: object
      properties:
        target: { type: string }
        number: { type: string }
      required: [target, number]

  # Everything that must be true before a single token is spent, and one thing that
  # must be true before anything can COMMIT: that no credential-shaped path is
  # unignored. An empty `git check-ignore` result means the commit step publishes
  # your key, and on a public repo that is publication, not a mistake you can take
  # back.
  - id: preflight
    script: preflight
    runtime: uv
    depends_on: [resolve]
    with:
      target: "$resolve.output.target"
    output_format:
      type: object
      properties:
        target: { type: string }
        number: { type: string }
        branch: { type: string }
        title: { type: string }
        base: { type: string }
        prior_attempt: { type: string }
      required: [target, number, branch, title, base]

  # --- 1. PLAN --------------------------------------------------------------
  # ARCHON'S PLANNER, not ours. `archon-plan` is the sdlc pack's planning primitive:
  # it grounds itself against the current repository, writes $ARTIFACTS_DIR/plan.md,
  # and returns `ready` -- and it refuses to mutate the checkout while doing it.
  #
  # THE FACTORY'S OWN prime AND plan NODES ARE GONE. `prime` existed to hand a cheap
  # reading of the repo to an expensive planner we owned; `archon-plan` does its own
  # grounding, so priming.md had exactly one reader and it has been deleted. Two
  # planning prompts in one system is the duplication this integration exists to end.
  #
  # `preflight` has already written issue.md, MISSION.md, FACTORY_RULES.md,
  # decisions.md and PRIOR-ATTEMPT.md into $ARTIFACTS_DIR, so the planner is pointed at
  # them rather than told to go looking.
  #
  # THE TIER IS THE PACK'S. archon-plan declares `model: large` and a workflow's model
  # is stamped onto its own nodes before expansion, so this runs on the premium tier
  # whatever this workflow declares. That is the pack's choice and adopting it is the
  # point; rebind `large` if you want it cheaper.
  - id: plan
    include: archon-plan
    denied_tools:
      - "Read(.factory/holdout/**)"
      - "Glob(.factory/holdout/**)"
      - "Grep(.factory/holdout/**)"
    depends_on: [preflight]
    with:
      work: >-
        Plan the work described in $ARTIFACTS_DIR/issue.md. Read it first, then
        $ARTIFACTS_DIR/MISSION.md and $ARTIFACTS_DIR/FACTORY_RULES.md -- the mission's
        out-of-scope list decides whether this should be built at all, and a plan that
        exceeds the size or protected-path rules in FACTORY_RULES cannot be merged by
        this factory. $ARTIFACTS_DIR/decisions.md records prior decisions to honour,
        and $ARTIFACTS_DIR/PRIOR-ATTEMPT.md exists only when this branch already
        carries a failed attempt worth reading before you re-plan it.

        Nobody will read the resulting code before it merges, so declare `ready: false`
        rather than planning around an ambiguity you would normally raise in review.

        When you DO settle a small, reversible detail the issue left open -- a label's
        wording, a default, an ordering nobody specified -- write it to
        $ARTIFACTS_DIR/ASSUMPTIONS as `KEY=value` at the start of a line followed by an
        indented paragraph saying why. Each one holds the merge for a human, which is
        the point: the build proceeds, and a person agrees with the call before it
        ships. A judgement value -- a lock, a floor, a tolerance, a sample size -- is
        NOT an assumption. Choosing one of those is tuning the judge, and it is a
        `ready: false` instead.

  # An explicit refusal beats a silent no-op. `archon-plan` declares `ready: false`
  # rather than writing a sentinel, and this is the only thing that turns that into a
  # state change -- it CANCELS the run rather than letting five more nodes build against
  # a plan that says "do not build this". The ESCALATE sentinel is still read below,
  # because a REWRITTEN planner may still use it, but the pack's `ready` is the primary
  # refusal now.
  - id: gate-plan
    script: gate-plan
    runtime: uv
    depends_on: [plan]
    with:
      target: "$preflight.output.target"
      # The pack's own "this is not ready to build" verdict, which replaces the
      # ESCALATE sentinel our planner used to write. Without this binding the
      # capability would simply disappear on the swap: archon-plan writes no sentinel,
      # gate-plan would find none, and every run would proceed -- including the ones
      # the planner explicitly refused. A lost refusal is the most expensive thing an
      # unattended factory can drop.
      plan_ready: "$plan.output.ready"
    output_format:
      type: object
      properties:
        proceed: { type: boolean }
        reason: { type: string }
      required: [proceed, reason]

  - id: stop-escalated
    cancel: "The plan node escalated. The issue is parked at needs-human with the reason on it."
    depends_on: [gate-plan]
    when: "$gate-plan.output.proceed == false"

  # --- 2. IMPLEMENT ---------------------------------------------------------
  # ARCHON'S BUILDER. `archon-implement` loops the implement command until it reports
  # done (max 5), returns a structured {done, green, red_cause, summary}, and ends in a
  # deterministic `assert-changed` guard that refuses a run which declined its task --
  # because an AI node that declines still exits 0.
  #
  # It is strictly more than the single-shot command node it replaces, which had no
  # loop, no green verdict and no decline guard.
  #
  # IT COMMITS AS IT GOES. That is why `commit` below now treats a clean tree with
  # commits ahead of base as success rather than as "nothing happened".
  - id: implement
    include: archon-implement
    denied_tools:
      - "Read(.factory/holdout/**)"
      - "Glob(.factory/holdout/**)"
      - "Grep(.factory/holdout/**)"
      - "Bash(gh:*)"
    depends_on: [gate-plan]
    when: "$gate-plan.output.proceed == true"
    with:
      work: >-
        Implement $ARTIFACTS_DIR/plan.md in full, working it task by task and running
        each task's validation as you go. The issue it serves is
        $ARTIFACTS_DIR/issue.md and the rules this repository merges under are
        $ARTIFACTS_DIR/FACTORY_RULES.md -- the size and protected-path limits there are
        enforced by a guard after you, so exceeding them wastes the lap.

        Nothing outside the plan. Nobody reads this diff before it merges, so an
        unrelated improvement is indistinguishable from an unreviewed change.

  # --- 4. COMMIT ------------------------------------------------------------
  # WITHOUT THIS THE WHOLE LAP IS THEATRE. The implement node edits files in the
  # worktree, nothing records them, and the worktree is discarded: every node
  # reports OK, the guard correctly sees two changed files, and the branch ends up
  # empty. Driving the lap by hand hides it, because a human commits without being
  # told to.
  #
  # It also ASSERTS ON THE ARTIFACT rather than the exit code. A node that was
  # denied a tool exits 0 having changed nothing, and "the run succeeded" is then
  # true and useless.
  - id: commit
    script: commit
    runtime: uv
    depends_on: [implement]
    with:
      number: "$preflight.output.number"
      title: "$preflight.output.title"
      base: "$preflight.output.base"
    output_format:
      type: object
      properties:
        sha: { type: string }
        files: { type: integer }
      required: [sha, files]

  # --- 5. GUARD -------------------------------------------------------------
  # Protected paths and the scope caps, BEFORE anything else is evaluated: a change
  # that can edit the rulebook must not be judged against the edited rulebook. Fails
  # CLOSED -- a diff that cannot be computed is not a diff that was checked.
  - id: guard
    script: guard-branch
    runtime: uv
    depends_on: [commit]
    with:
      base: "$preflight.output.base"
      target: "$preflight.output.target"

  # --- 6. SELF-CHECK --------------------------------------------------------
  # The full gate, run here for the BUILDER's benefit. Nothing downstream trusts it
  # -- the validator re-runs everything in its own process -- but a lap that opens a
  # PR it already knows is red wastes a whole validation cycle to learn it.
  - id: selfcheck
    script: selfcheck
    runtime: uv
    depends_on: [guard]
    timeout: 1800000

  # --- 7. REVIEW ------------------------------------------------------------
  # The only step that reads the diff AS CODE rather than as a set of markers, and
  # the factory does not write it. This is Archon's `sdlc` pack -- code, seams,
  # simplify and tests always, errors and docs when the change warrants them, each
  # finding carrying the lenses that raised it. It ships bundled in the engine, so
  # there is nothing to install and nothing to keep in sync: `include:` resolves it
  # from the binary, and a project workflow of the same name would override it if
  # you ever wanted your own.
  #
  # `scope: ""` is deliberate. Given a PR the pack reviews the PR; given nothing it
  # reviews the working diff against the merge base, which is where this factory
  # reviews -- BEFORE the pull request exists, so a diff that should never be
  # published is never published.
  #
  # THE DENY LIST IS THE ONLY REASON THIS COMPOSITION IS SAFE. Every node the pack
  # expands into grants Read, and none of them carries this factory's holdout deny,
  # because the pack knows nothing about a holdout. An include unions `denied_tools`
  # onto every expanded node, so the wall holds across a block written by somebody
  # else. Verify it rather than trusting it: expand this workflow and confirm every
  # non-exec node under `review__` carries the deny. Without it a reviewer could
  # quote a holdout assertion into a report the fix node then reads, and the wall
  # would be gone with every check still green.
  # The pack's lens gates compare `$INPUTS.errors` against a string, so this input has
  # to arrive as a NODE-OUTPUT reference rather than a literal. A literal `"true"`
  # substitutes into the gate as `true == 'true'`, which is not a parseable condition
  # and fails the whole workflow at load. One echo is cheaper than discovering that in
  # a run, and it is also the seam: make this a classifier when you want the lens
  # chosen per diff rather than always on.
  #
  # Always on, deliberately. The silent-failure lens is the one that reads error paths,
  # and a factory whose defining property is that nobody reads the diff is exactly the
  # place you do not economise on it.
  #
  # `docs` is emitted here too, even though "auto" IS its default, because the default
  # is a literal and hits the same wall: leaving it unset makes the pack's own docs gate
  # read `auto == 'auto'` and the workflow fails to load. Both inputs have to arrive as
  # node references for `archon-review` to be includable at all.
  - id: review-scope
    bash: echo '{"errors":"true","docs":"auto"}'
    depends_on: [selfcheck]
    # Declared, because a consumer reading an undeclared field fails naming ITSELF
    # rather than the producer that never promised the field -- and the failure lands
    # eight nodes and one premium model after the mistake was made.
    output_format:
      type: object
      properties:
        errors: { type: string }
        docs: { type: string }
      required: [errors, docs]

  - id: review
    include: archon-review
    depends_on: [review-scope]
    denied_tools:
      - "Read(.factory/holdout/**)"
      - "Glob(.factory/holdout/**)"
      - "Grep(.factory/holdout/**)"
      - "Bash(gh:*)"
      - "Bash(git push:*)"
      - "Bash(git commit:*)"
    with:
      scope: ""
      errors: "$review-scope.output.errors"
      docs: "$review-scope.output.docs"
      work_order: >-
        The accepted work order is $ARTIFACTS_DIR/issue.md, and the plan this build
        followed is $ARTIFACTS_DIR/plan.md. Anything outside them is scope creep and
        is a finding even when the extra code is good.

  # --- 8. THE PR RECORD -----------------------------------------------------
  # All that is left of the factory's own review step: turn the pack's report into
  # the record `open-pr` requires. Kept separate rather than folded into the review
  # because the pack is advisory and read-only by contract, and the front matter
  # here is load-bearing -- a rewrite that drops `issue` or `title` produces a
  # perfectly readable pull request that nothing can validate.
  - id: pr-record
    command: pr-record
    model: medium
    context: fresh
    # ENGINE-ENFORCED, and this one has teeth. The pack's advisory nodes carry the same
    # declaration and it is the reason `archon-plan` cannot quietly edit the repository
    # while planning it: the engine snapshots the working tree and fails the node,
    # naming the paths, if anything outside the run's own artifact/state/log directories
    # moved.
    #
    # It matters HERE because of where this node sits -- after `commit`, before
    # `open-pr`. Anything it writes is not in the commit and is not in the PR, but it IS
    # in the tree the push runs against, so a stray file turns a green lap into a dirty
    # push nobody asked for. This node reads $ARTIFACTS_DIR and writes $ARTIFACTS_DIR;
    # now the engine agrees rather than the prompt asking nicely.
    mutates_checkout: false
    depends_on: [review]
    allowed_tools: [Read, Glob, Grep, Write]
    denied_tools: ["Read(.factory/holdout/**)", "Glob(.factory/holdout/**)", "Grep(.factory/holdout/**)"]

  # --- 9. OPEN THE PR -------------------------------------------------------
  # Push and open, by the script, from the record node's file. Same rule as the
  # merge: a node holding `gh pr create` is a node that can open a PR against any
  # branch it likes, including one nothing validated.
  - id: open-pr
    script: open-pr
    runtime: uv
    depends_on: [pr-record]
    with:
      target: "$preflight.output.target"
      number: "$preflight.output.number"
      branch: "$preflight.output.branch"
      base: "$preflight.output.base"
    output_format:
      type: object
      properties:
        pr: { type: string }
        url: { type: string }
      required: [pr, url]
