# THE REFUSAL, AND IT IS THE MOST EXPENSIVE THING THIS FACTORY CAN DROP.
#
# The factory's own planner used to write an ESCALATE sentinel; `archon-plan` writes
# none, and returns `ready: false` instead. The whole capability therefore hangs on one
# binding -- `plan_ready: "$plan.output.ready"` -- and on `stop-escalated` cancelling
# the run rather than merely logging. Get either wrong and the refusal disappears in
# the quietest possible way: every node still succeeds, the builder builds the thing
# the planner explicitly said not to build, and the only trace is a `ready: false` in a
# node output nobody reads.
#
# It has fired for real exactly once, on flagpole issue #3, where the planner refuted a
# claim in the issue and found a governance gap that had been open for hours. That run
# cost a premium plan node to learn the wiring worked. This costs nothing.
#
# Nothing after `gate-plan` is stubbed. Every one of those nodes must be skipped by its
# `when:` or by depending on something that was -- an unstubbed node that ran would
# fail, so the absence IS the assertion that the refusal stopped the lap.
resolve: '{"target":"gh:issue:3","number":"3"}'
preflight:
  target: "gh:issue:3"
  number: "3"
  branch: "factory/impl-3"
  title: "Reject a check for a user id longer than 200 characters"
  base: "main"
  prior_attempt: ""

plan__plan:
  ready: false
  summary: >-
    stub: the issue asserts the endpoint accepts a megabyte; it does not, and the
    governance files disagree with each other about what is protected. Both are
    decisions for a human.
plan__assert-intact: '{"intact":"true"}'
gate-plan: '{"proceed":false,"reason":"archon-plan returned ready: false"}'

fixture:
  expect: cancelled
  reached: [gate-plan, stop-escalated]
