name: factory-fix
description: |
  Address the validator's findings on ONE pull request, then hand it back to the
  independent validator. Bounded by an attempt cap.

  Use when: the dispatcher finds a PR labelled factory:needs-fix under the cap.
  By hand:
    archon workflow run factory-fix --branch factory/fix-14 "fix gh:pr:14"
  NOT for: the first implementation (factory-implement) or judging
  (factory-validate).

  WHY THIS IS ITS OWN WORKFLOW rather than a loop inside the validator. A fix that
  runs in the same process as the judgement it is answering can inherit the judge's
  reasoning, and then the next validation is judging a tree that was built with its
  own previous opinion in context. A separate dispatch means a separate process, a
  separate worktree and a separate context, and the findings reach it as a file on
  disk rather than as ambient memory.

  A FIX IS NEVER SELF-CERTIFIED. The node that made the change does not get to
  decide the change worked. This ends by setting the PR back to needs-review.

model: medium

inputs:
  target:
    default: ""
    description: >-
      The pull request to fix, as gh:pr:<n>. When empty, it is parsed out of the
      run's trigger message.

returns: land

nodes:
  - id: resolve
    script: resolve-target
    runtime: uv
    with:
      declared: "$INPUTS.target"
      kind: pr
    output_format:
      type: object
      properties:
        target: { type: string }
        number: { type: string }
      required: [target, number]

  # The attempt cap is checked HERE, before anything is spent, as well as by the
  # dispatcher. Two checks because they fail differently: the dispatcher stops
  # scheduling, this stops a hand-run from spending a third attempt the rules say
  # does not exist.
  #
  # It also loads the FINDINGS, and asserts they exist. A fix node with nothing to
  # read does not crash -- it re-reads the diff and invents an objection, which is
  # how you get a confident commit that addresses nothing and burns one of two
  # attempts.
  - id: prepare
    script: prepare-fix
    runtime: uv
    depends_on: [resolve]
    timeout: 600000
    with:
      target: "$resolve.output.target"
    output_format:
      type: object
      properties:
        target: { type: string }
        number: { type: string }
        branch: { type: string }
        base: { type: string }
        attempt: { type: integer }
      required: [target, number, branch, base, attempt]

  # ARCHON'S BUILDER, again. Addressing review findings IS implementing -- the only
  # difference is where the work order came from, and `archon-implement` takes "review
  # findings" as a first-class input. Keeping a second, weaker fix prompt beside it
  # meant the correction path had no loop, no green verdict and no decline guard while
  # the build path had all three.
  #
  # `prepare` has already asserted the findings onto disk. The validator recorded what
  # it objected to, its worktree is gone, and a fix node that re-reads the diff instead
  # invents an objection -- which is how a confident commit fixes something nobody
  # asked about.
  - id: fix
    include: archon-implement
    denied_tools:
      - "Read(.factory/holdout/**)"
      - "Glob(.factory/holdout/**)"
      - "Grep(.factory/holdout/**)"
      - "Bash(gh:*)"
    depends_on: [prepare]
    with:
      work: >-
        Address the validator's findings in $ARTIFACTS_DIR/findings.md, and nothing
        else. Read them first, then $ARTIFACTS_DIR/issue.md for what this change was
        meant to do and $ARTIFACTS_DIR/gate.log for the raw output of the checks that
        ran. The rules this repository merges under are
        $ARTIFACTS_DIR/FACTORY_RULES.md.

        These findings are the record of an INDEPENDENT judge that has already run and
        whose working copy is gone. Do not re-derive them from the diff: a finding you
        cannot see the cause of is one to report, not one to reinterpret. Changing
        anything the findings did not name is out of scope, and nobody reads this diff
        before it merges.

  # Commit, push, bump the attempt counter, and hand back. ONE transition, to
  # `open`: a fixed PR is a PR waiting to be validated, and `validating` is owned by
  # a running validation and nothing else may hand it out.
  - id: land
    script: land-fix
    runtime: uv
    depends_on: [fix]
    with:
      target: "$prepare.output.target"
      number: "$prepare.output.number"
      branch: "$prepare.output.branch"
      attempt: "$prepare.output.attempt"
