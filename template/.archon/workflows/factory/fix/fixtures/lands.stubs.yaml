# A correction round: read the findings the validator left on disk, address them with
# Archon's builder, commit and hand the PR back for an independent re-judgement.
#
# The one transition that matters is at the end. `land` moves the PR to `open`, never
# to `passed` and never to `validating` -- a fix is never self-certified, and
# `validating` is owned by a running validation and nothing else may hand it out.
resolve: '{"target":"gh:pr:14","number":"14"}'
prepare:
  target: "gh:pr:14"
  number: "14"
  branch: "factory/impl-12"
  base: "main"
  attempt: 1
fix__record-start: '{"start":"recorded"}'
fix__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: addressed both findings, quick gate green"
fix__assert-changed: "1 file changed since the recorded start sha"
land: "gh:pr:14 -> open (attempt 2 of 2)"
fixture:
  expect: completed
  reached: [fix__implement, land]
