# Project-owned factory settings. Run factory-setup after editing.
project:
  repo_host: github.com
  repo_path: ""

app_check:
  enabled: false
  trigger: frontend
  frontend_paths: ["app/**", "public/**", "src/**/*.css", "src/**/*.html", "src/**/*.tsx", "src/**/*.jsx"]
  depth: auto

# Keep private scenarios outside the repository. Supply an absolute project-specific path.
holdouts:
  enabled: false
  path: ""

protected_paths: [".archon/**", ".github/**", "DEPLOY.md"]
autonomy: standard

app:
  prepare: ""
  start: ""
  port_env: PORT
  database_env: ""
  health_path: /health
  # Apps a browser cannot drive (a game behind a harness): absolute path to the owner's
  # runtime instructions, and the teardown cleanup runs from the checkout.
  runtime: ""
  teardown: ""

# Leave assistant empty to inherit Archon's selected provider. Configured profiles
# require an explicit provider and model supported by the Archon installation.
models:
  assistant: ""
  tiers: {}
  aliases: {}
  # aliases:
  #   '@factory-manager': { provider: YOUR_PROVIDER, model: YOUR_MODEL, effort: high }

# Generation writes current Archon timer-binding JSON only. It never installs or fires a timer.
triggers:
  enabled: false
  host_id: ""
  run_as_user_id: ""
  build_queue: { interval_seconds: 1800 }
  merge_queue: { interval_seconds: 1800 }
  discoveries: { interval_seconds: 14400 }
  manager: { interval_seconds: 14400 }
  app_check: { interval_seconds: 1800 }
