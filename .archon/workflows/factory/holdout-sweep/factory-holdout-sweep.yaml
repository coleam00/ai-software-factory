name: factory-holdout-sweep
description: Run the batch of holdout scenarios checked longest ago against the default branch, record the verdicts, and file a failing one as an issue. The backstop for scenarios a pull request's check skipped.
inputs:
  repo_path:
    required: true
    description: GitHub owner/name.
returns: record
worktree:
  enabled: false
mutates_checkout: false
nodes:
  - id: config
    script: config
    runtime: bun
    output_format: { type: object }

  - id: plan
    script: plan
    runtime: bun
    depends_on: [config]
    with: { config: "$config.output", repo_path: "$INPUTS.repo_path" }
    output_format:
      type: object
      properties:
        run: { type: boolean }
        ids: { type: array, items: { type: string } }
        base: { type: string }
        head: { type: string }
        holdout_dir: { type: string }
        reason: { type: string }
      required: [run, ids, base, head, holdout_dir, reason]

  - id: prepare
    script: prepare
    runtime: bun
    depends_on: [plan]
    when: "$plan.output.run == true"
    with: { base: "$plan.output.base", head: "$plan.output.head" }
    output_format:
      type: object
      properties: { temp: { type: string }, merged: { type: string }, prepared_at: { type: integer } }
      required: [temp, merged, prepared_at]

  - id: check
    command: sweep-check
    depends_on: [prepare]
    when: "$plan.output.run == true"
    model: ['@factory-reviewer', large]
    mutates_checkout: false
    with:
      checkout: "$prepare.output.temp"
      merged: "$prepare.output.merged"
      config: "$config.output"
      holdout_dir: "$plan.output.holdout_dir"
      expected_holdouts: "$plan.output.ids"
    output_format:
      type: object
      properties:
        overall: { type: string, enum: [PASS, FAIL] }
        lines: { type: array, items: { type: string } }
        summary: { type: string }
      required: [overall, lines, summary]

  - id: evidence
    script: evidence
    runtime: bun
    depends_on: [check, prepare]
    with: { prepared_at: "$prepare.output.prepared_at", expected_holdouts: "$plan.output.ids" }
    output_format:
      type: object
      properties:
        overall: { type: string, enum: [PASS, FAIL] }
        lines: { type: array, items: { type: string } }
      required: [overall, lines]

  - id: record
    script: record
    runtime: bun
    depends_on: [evidence]
    with:
      config: "$config.output"
      repo_path: "$INPUTS.repo_path"
      base: "$plan.output.base"
      head: "$plan.output.head"
      lines: "$evidence.output.lines"
    output_format:
      type: object
      properties:
        recorded: { type: integer }
        filed: { type: array, items: { type: integer } }
        cleared: { type: array, items: { type: integer } }
      required: [recorded, filed, cleared]

  - id: cleanup
    script: cleanup
    runtime: bun
    depends_on: [plan, prepare, check, evidence, record]
    trigger_rule: all_done
    with: { config: "$config.output" }
    output_format:
      type: object
      properties:
        cleaned: { type: boolean }
        app_record: { type: boolean }
        app_cleanup: { type: string, enum: [stopped, already-exited, no-record, invalid-record, identity-mismatch, unsupported-platform, stop-failed] }
        teardown: { type: string, enum: [ok, failed, none] }
      required: [cleaned, app_record, app_cleanup, teardown]
